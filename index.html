<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Viewport optimisé pour bloquer les distorsions mobiles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeu Concours - Ivoirshop</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px 15px;
            /* Remplacement de height: 100vh pour supporter la barre mobile */
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: #ffffff;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 100%;
            max-width: 380px;
            margin: auto;
        }

        h1 {
            color: #222;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            line-height: 1.3;
        }

        /* Police à 16px minimum pour éviter le zoom forcé sur iPhone */
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 1.5px solid #dcdde1;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fafafa;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        input:focus {
            border-color: #f39c12;
            background-color: #ffffff;
        }

        button {
            width: 100%;
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            -webkit-appearance: none;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .resultat {
            display: none;
            padding: 10px 0 0 0;
            animation: fadeIn 0.35s ease-in-out;
        }

        .felicitations { color: #27ae60; font-size: 20px; font-weight: bold; }
        .perdu { color: #e74c3c; font-size: 20px; font-weight: bold; }
        .non-inscrit { color: #d35400; font-size: 19px; font-weight: bold; }

        .product-img {
            width: 100%;
            max-width: 220px;
            height: auto;
            max-height: 180px;
            object-fit: contain;
            margin: 15px auto;
            border-radius: 8px;
            display: block;
        }

        .btn-action {
            display: block;
            margin-top: 15px;
            padding: 13px;
            color: white;
            background-color: #ff6600;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .btn-secondary {
            background-color: #95a5a6;
            margin-top: 12px;
            font-size: 14px;
            padding: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="form-section">
        <h1>🎁 Consultez votre résultat</h1>
        <form id="gameForm" onsubmit="verifier(event)">
            <input type="text" id="nom" placeholder="Votre Nom complet" required autocomplete="name">
            <input type="tel" id="telephone" placeholder="Votre Numéro de téléphone" required autocomplete="tel">
            <button type="submit" id="btn-submit">Vérifier mon statut</button>
        </form>
    </div>

    <!-- Section Résultat -->
    <div id="result-section" class="resultat"></div>
</div>

<script>
    // ⚠️ IMPORTANT : Remplacer l'URL ci-dessous par l'URL de votre application Web Google Apps Script !
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_RJCGB71HoJyNo_8OZ8gUw6vRHn_JOZDgjJG26V3MfJv5qfTDb5CmmqfP-cZoWM7sdQ/exec";

    async function verifier(event) {
        event.preventDefault();

        const btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.innerText = "Vérification...";

        const payload = {
            nom: document.getElementById('nom').value,
            telephone: document.getElementById('telephone').value
        };

        if (GOOGLE_SCRIPT_URL === "VOTRE_LIEN_GOOGLE_APPS_SCRIPT_ICI") {
            alert("Veuillez configurer l'URL de Google Apps Script dans le code (ligne 116).");
            btn.disabled = false;
            btn.innerText = "Vérifier mon statut";
            return;
        }

        try {
            // Utiliser JSONP pour contourner à 100% les problèmes CORS
            const url = new URL(GOOGLE_SCRIPT_URL);
            url.searchParams.append('nom', payload.nom);
            url.searchParams.append('telephone', payload.telephone);
            
            // Créer une fonction de rappel unique
            const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
            url.searchParams.append('callback', callbackName);
            
            window[callbackName] = function(res) {
                afficherReponse(res);
                delete window[callbackName]; // Nettoyer après usage
            };
            
            const script = document.createElement('script');
            script.src = url.toString();
            script.onerror = function() {
                alert("Erreur de connexion avec le serveur. Veuillez réessayer.");
                btn.disabled = false;
                btn.innerText = "Vérifier mon statut";
            };
            document.body.appendChild(script);
            
        } catch (err) {
            console.error(err);
            alert("Erreur de préparation de la requête.");
            btn.disabled = false;
            btn.innerText = "Vérifier mon statut";
        }
    }

    function afficherReponse(res) {
        const formDiv = document.getElementById('form-section');
        const resultDiv = document.getElementById('result-section');

        if (res.error) {
            alert("Erreur : " + res.error);
            const btn = document.getElementById('btn-submit');
            btn.disabled = false;
            btn.innerText = "Vérifier mon statut";
            return;
        }

        formDiv.style.display = 'none';
        resultDiv.style.display = 'block';

        // 1. Client non répertorié
        if (!res.match || res.nonInscrit) {
            resultDiv.innerHTML = `
                <div class="non-inscrit">⚠️ Oups, vous n'êtes pas inscrit(e)</div>
                <p style="margin: 12px 0; font-size: 14px; color: #555; line-height: 1.4;">
                    Abonnez-vous à <strong>Ivoirshop</strong> pour participer aux jeux et remporter des cadeaux.
                </p>
                <a href="https://ivoirshop.ci" target="_blank" class="btn-action">S'abonner sur Ivoirshop</a>
                <button onclick="location.reload()" class="btn-secondary">Réessayer</button>
            `;
            return;
        }

        // 2. Client trouvé : Gagné
        if (res.gagne) {
            const imageHtml = res.image ? `<img class="product-img" src="${res.image}" alt="${res.lot}">` : '';
            resultDiv.innerHTML = `
                <div class="felicitations">🎉 Félicitations ${res.nom} !</div>
                <p style="margin: 10px 0 5px 0;">Vous avez remporté :<br><strong style="font-size: 18px; color: #222;">${res.lot}</strong></p>
                ${imageHtml}
                <div style="background-color: #e8f8f5; border: 1px solid #27ae60; border-radius: 8px; padding: 12px; margin-top: 15px;">
                    <p style="font-size: 14px; color: #27ae60; margin: 0; font-weight: bold;">⚠️ Dernière Étape :</p>
                    <p style="font-size: 13px; color: #222; margin: 5px 0 0 0;">Faites une capture d'écran de ce lot et mettez-la en commentaire sur notre publication Facebook pour valider votre gain !</p>
                </div>
                <p style="font-size: 12px; color: #777; margin-top: 12px;">Notre équipe vous contactera sous peu.</p>
            `;
        } 
        // 3. Client trouvé : Perdu
        else {
            resultDiv.innerHTML = `
                <div class="perdu">😢 Dommage ${res.nom}...</div>
                <p style="color: #555; font-size: 15px; margin: 10px 0;">Ce n'est pas pour cette fois, vous n'avez pas remporté de lot.</p>
                <p style="font-size: 13px; color: #777;">Restez connecté sur Ivoirshop pour les prochains tirages !</p>
                <button onclick="location.reload()" class="btn-secondary" style="background-color: #3498db;">Retour</button>
            `;
        }
    }
</script>

</body>
</html>
