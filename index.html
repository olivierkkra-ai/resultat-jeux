<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Viewport optimisé pour bloquer les distorsions mobiles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeu Concours - Ivoirshop</title>
    <!-- Ajout de la police Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Ajout de la police Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Arrière-plan festif avec une image pour donner de la profondeur */
            background: linear-gradient(rgba(255, 154, 68, 0.8), rgba(252, 96, 118, 0.8)), 
                        url('https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 20px 15px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            /* Effet Glassmorphism (verre) beaucoup plus visible avec une image de fond */
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 100%;
            max-width: 420px;
            margin: auto;
            position: relative;
            z-index: 1;
        }

        /* L'image en haut de la carte */
        .header-image {
            width: 100px;
            height: auto;
            margin-top: -60px; /* Fait déborder l'image vers le haut pour un effet 3D */
            margin-bottom: 15px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
        }

        h1 {
            color: #ff5e00;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 24px;
            font-weight: 800;
            line-height: 1.3;
        }
        
        .subtitle {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 15px;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            outline: none;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }

        input:focus {
            border-color: #ff6600;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.15), inset 0 2px 5px rgba(0,0,0,0.02);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #ff7e5f, #ff4e00);
            color: white;
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            box-shadow: 0 8px 20px rgba(255, 94, 0, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 94, 0, 0.5);
        }

        button:active {
            transform: scale(0.96);
        }

        button:disabled {
            background: #bdc3c7;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .resultat {
            display: none;
            padding: 10px 0 0 0;
            animation: fadeIn 0.4s ease-out;
        }

        .felicitations { color: #27ae60; font-size: 24px; font-weight: 800; }
        .perdu { color: #e74c3c; font-size: 24px; font-weight: 800; }
        .non-inscrit { color: #d35400; font-size: 22px; font-weight: 800; }

        .product-img {
            width: 100%;
            max-width: 250px;
            height: auto;
            max-height: 220px;
            object-fit: contain;
            margin: 20px auto;
            border-radius: 12px;
            display: block;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15));
        }

        .btn-action {
            display: block;
            margin-top: 15px;
            padding: 16px;
            color: white;
            background: #ff6600;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(255, 102, 0, 0.3);
            text-transform: uppercase;
        }

        .btn-secondary {
            background: #95a5a6;
            box-shadow: 0 4px 10px rgba(149, 165, 166, 0.3);
            margin-top: 15px;
            font-size: 14px;
            padding: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="form-section">
        <!-- Image de cadeau en 3D qui dépasse en haut -->
        <img src="https://cdn3d.iconscout.com/3d/premium/thumb/gift-box-4993447-4159595.png" alt="Cadeau" class="header-image">
        <h1>Résultats du Concours</h1>
        <p class="subtitle">Découvrez si vous avez gagné un lot !</p>
        
        <form id="gameForm" onsubmit="verifier(event)">
            <input type="text" id="nom" placeholder="Votre Nom complet" required autocomplete="name">
            <input type="tel" id="telephone" placeholder="Votre Numéro de téléphone" required autocomplete="tel">
            <button type="submit" id="btn-submit">Vérifier mon statut</button>
        </form>
    </div>

    <!-- Section Résultat -->
    <div id="result-section" class="resultat"></div>
</div>

<script>
    // ⚠️ IMPORTANT : Remplacer l'URL ci-dessous par l'URL de votre application Web Google Apps Script !
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_RJCGB71HoJyNo_8OZ8gUw6vRHn_JOZDgjJG26V3MfJv5qfTDb5CmmqfP-cZoWM7sdQ/exec";

    async function verifier(event) {
        event.preventDefault();

        const btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.innerText = "Vérification...";

        const payload = {
            nom: document.getElementById('nom').value,
            telephone: document.getElementById('telephone').value
        };

        if (GOOGLE_SCRIPT_URL === "VOTRE_LIEN_GOOGLE_APPS_SCRIPT_ICI") {
            alert("Veuillez configurer l'URL de Google Apps Script dans le code (ligne 116).");
            btn.disabled = false;
            btn.innerText = "Vérifier mon statut";
            return;
        }

        try {
            // Utiliser JSONP pour contourner à 100% les problèmes CORS
            const url = new URL(GOOGLE_SCRIPT_URL);
            url.searchParams.append('nom', payload.nom);
            url.searchParams.append('telephone', payload.telephone);
            
            // Créer une fonction de rappel unique
            const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
            url.searchParams.append('callback', callbackName);
            
            window[callbackName] = function(res) {
                afficherReponse(res);
                delete window[callbackName]; // Nettoyer après usage
            };
            
            const script = document.createElement('script');
            script.src = url.toString();
            script.onerror = function() {
                alert("Erreur de connexion avec le serveur. Veuillez réessayer.");
                btn.disabled = false;
                btn.innerText = "Vérifier mon statut";
            };
            document.body.appendChild(script);
            
        } catch (err) {
            console.error(err);
            alert("Erreur de préparation de la requête.");
            btn.disabled = false;
            btn.innerText = "Vérifier mon statut";
        }
    }

    function afficherReponse(res) {
        const formDiv = document.getElementById('form-section');
        const resultDiv = document.getElementById('result-section');

        if (res.error) {
            alert("Erreur : " + res.error);
            const btn = document.getElementById('btn-submit');
            btn.disabled = false;
            btn.innerText = "Vérifier mon statut";
            return;
        }

        formDiv.style.display = 'none';
        resultDiv.style.display = 'block';

        // 1. Client non répertorié
        if (!res.match || res.nonInscrit) {
            resultDiv.innerHTML = `
                <div class="non-inscrit">⚠️ Oups, vous n'êtes pas inscrit(e)</div>
                <p style="margin: 12px 0; font-size: 14px; color: #555; line-height: 1.4;">
                    Abonnez-vous à <strong>Ivoirshop</strong> pour participer aux jeux et remporter des cadeaux.
                </p>
                <a href="https://ivoirshop.ci" target="_blank" class="btn-action">S'abonner sur Ivoirshop</a>
                <button onclick="location.reload()" class="btn-secondary">Réessayer</button>
            `;
            return;
        }

        // 2. Client trouvé : Gagné
        if (res.gagne) {
            const imageHtml = res.image ? `<img class="product-img" src="${res.image}" alt="${res.lot}">` : '';
            resultDiv.innerHTML = `
                <div class="felicitations">🎉 Félicitations ${res.nom} !</div>
                <p style="margin: 10px 0 5px 0;">Vous avez remporté :<br><strong style="font-size: 18px; color: #222;">${res.lot}</strong></p>
                ${imageHtml}
                <div style="background-color: #e8f8f5; border: 1px solid #27ae60; border-radius: 8px; padding: 12px; margin-top: 15px;">
                    <p style="font-size: 14px; color: #27ae60; margin: 0; font-weight: bold;">⚠️ Dernière Étape :</p>
                    <p style="font-size: 13px; color: #222; margin: 5px 0 0 0;">Faites une capture d'écran de ce lot et mettez-la en commentaire sur notre publication Facebook pour valider votre gain !</p>
                </div>
                <p style="font-size: 12px; color: #777; margin-top: 12px;">Notre équipe vous contactera sous peu.</p>
            `;
        } 
        // 3. Client trouvé : Perdu
        else {
            resultDiv.innerHTML = `
                <div class="perdu">😢 Dommage ${res.nom}...</div>
                <p style="color: #555; font-size: 15px; margin: 10px 0;">Ce n'est pas pour cette fois, vous n'avez pas remporté de lot.</p>
                <p style="font-size: 13px; color: #777;">Restez connecté sur Ivoirshop pour les prochains tirages !</p>
                <button onclick="location.reload()" class="btn-secondary" style="background-color: #3498db;">Retour</button>
            `;
        }
    }
</script>

</body>
</html>
